<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- iOS Web App Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bank of Ireland" />
    <meta name="apple-touch-fullscreen" content="yes" />
    
    <!-- Prevent iOS Safari UI and behaviors -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="theme-color" content="#126987" />
    <meta name="msapplication-navbutton-color" content="#126987" />
    <meta name="apple-mobile-web-app-orientation" content="portrait" />
    
    <!-- App Icons for iOS -->
    <link rel="apple-touch-icon" href="/BOI_logo.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/BOI_logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/BOI_logo.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/BOI_logo.png" />
    
    <!-- App Title -->
    <title>Bank of Ireland</title>
    
    <!-- Prevent text size adjustment on iOS -->
    <style>
      html {
        -webkit-text-size-adjust: 100%;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      
      body {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: none;
        position: fixed;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      #root {
        width: 100%;
        height: 100%;
        overflow: auto;
      }
      
      /* iOS safe area support */
      @supports (padding: max(0px)) {
        body {
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
      
      /* Prevent iOS Safari bounce scrolling */
      body {
        position: fixed;
        overflow: hidden;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-x pan-y;
        height: 100vh;
        height: 100dvh;
      }
      
      /* Optimize for iOS performance */
      * {
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }
      
      /* Remove iOS input styling */
      input, textarea, select {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        border-radius: 0;
      }
      
      /* Prevent iOS zoom on input focus */
      input[type="text"], input[type="password"], input[type="email"], input[type="tel"] {
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
