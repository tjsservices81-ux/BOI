<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
    
    <!-- iOS Web App Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bank of Ireland" />
    <meta name="apple-touch-fullscreen" content="yes" />
    
    <!-- Prevent iOS Safari UI -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Additional PWA meta tags -->
    <meta name="msapplication-TileColor" content="#126987" />
    <meta name="msapplication-config" content="none" />
    <meta name="application-name" content="Bank of Ireland" />
    
    <!-- App Icons for iOS -->
    <link rel="apple-touch-icon" href="/BOI_logo.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/BOI_logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/BOI_logo.png" />
    
    <!-- PWA Manifest -->
    <!-- <link rel="manifest" href="/manifest.json" /> -->
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/BOI_logo.png" />
    
    <!-- App Title -->
    <title>Bank of Ireland</title>
    
    <!-- Fullscreen website styling -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        -webkit-text-size-adjust: 100%;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
      
      body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #126987;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: none;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      
      #root {
        width: 100vw;
        height: 100vh;
        overflow: auto;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
      
      /* Hide scrollbars but keep functionality */
      #root::-webkit-scrollbar {
        display: none;
      }
      
      #root {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Fullscreen enforcement */
      html, body, #root {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
      }
      
      /* iOS specific fullscreen */
      @supports (-webkit-touch-callout: none) {
        html, body {
          height: -webkit-fill-available;
          width: -webkit-fill-available;
        }
        
        #root {
          height: -webkit-fill-available;
          width: -webkit-fill-available;
        }
      }
      
      /* Hide address bar and browser UI */
      @media screen and (max-width: 768px) {
        html {
          height: calc(100vh + env(keyboard-inset-height, 0px));
        }
        
        body {
          height: calc(100vh + env(keyboard-inset-height, 0px));
        }
      }
      
      /* Prevent zoom */
      input, textarea, select {
        font-size: 16px !important;
      }
      
      /* Remove tap highlights */
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-focus-ring-color: transparent;
        outline: none;
      }
    </style>
    
    <script>
      // Force fullscreen display and hide browser UI
      function hideAddressBar() {
        setTimeout(() => {
          window.scrollTo(0, 1);
        }, 100);
        
        setTimeout(() => {
          window.scrollTo(0, 0);
        }, 200);
      }
      
      // Hide address bar on load
      window.addEventListener('load', hideAddressBar);
      window.addEventListener('orientationchange', hideAddressBar);
      window.addEventListener('resize', hideAddressBar);
      
      // Prevent zoom and scroll
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault();
        }
      });
      
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, false);
      
      // Prevent context menu
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });
      
      // Force fullscreen on iOS
      if (navigator.userAgent.match(/iPhone|iPad|iPod/i)) {
        window.addEventListener('touchstart', function() {
          if (window.scrollY === 0) {
            document.body.scrollTop = 1;
          }
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
