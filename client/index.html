<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- iOS Web App Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bank of Ireland" />
    <meta name="apple-touch-fullscreen" content="yes" />
    
    <!-- Prevent iOS Safari UI -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Additional PWA meta tags -->
    <meta name="msapplication-TileColor" content="#126987" />
    <meta name="msapplication-config" content="none" />
    <meta name="application-name" content="Bank of Ireland" />
    
    <!-- App Icons for iOS -->
    <link rel="apple-touch-icon" href="/BOI_logo.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/BOI_logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/BOI_logo.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/BOI_logo.png" />
    
    <!-- App Title -->
    <title>Bank of Ireland</title>
    
    <!-- Prevent text size adjustment on iOS -->
    <style>
      html {
        -webkit-text-size-adjust: 100%;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      
      body {
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: none;
        position: fixed;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      
      #root {
        width: 100%;
        height: 100%;
        overflow: auto;
      }
      
      /* iOS safe area support */
      @supports (padding: max(0px)) {
        body {
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
        }
      }
      
      /* PWA standalone mode detection and styling */
      @media all and (display-mode: standalone) {
        body {
          background-color: #126987;
        }
        
        /* Hide any browser-specific UI elements */
        html, body {
          overflow-x: hidden;
          -webkit-overflow-scrolling: touch;
        }
      }
      
      /* Additional iOS PWA support */
      @media (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) {
        /* iPhone X/XS specific adjustments */
        body {
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
