<!DOCTYPE html>
<html>
<head>
    <title>Multi-Day Frontend Persistence Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f8f9fa; }
        .test-container { background: white; padding: 20px; margin: 15px 0; border-radius: 8px; border: 1px solid #dee2e6; }
        .result { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        .timeline { background: #e9ecef; padding: 15px; border-radius: 6px; margin: 10px 0; }
        .day-marker { font-weight: bold; color: #495057; margin: 10px 0; }
        .auth-status { background: #f8f9fa; padding: 10px; border-radius: 4px; margin: 10px 0; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Frontend Multi-Day Persistence Test</h1>
    <p>This test simulates how authentication persists across multiple days in actual frontend usage.</p>

    <div class="test-container">
        <h3>Step 1: Create Test User Session</h3>
        <button onclick="createTestSession()">Create Test User & Login</button>
        <div id="step1-result"></div>
    </div>

    <div class="test-container">
        <h3>Step 2: Simulate Time Passage</h3>
        <button onclick="simulateTimePassage()">Run Multi-Day Simulation</button>
        <div id="timeline"></div>
        <div id="step2-result"></div>
    </div>

    <div class="test-container">
        <h3>Step 3: Frontend Persistence Check</h3>
        <button onclick="checkFrontendPersistence()">Check Current Auth State</button>
        <div id="step3-result"></div>
    </div>

    <script>
        let testStartTime = Date.now();
        let simulationResults = [];

        function showResult(elementId, type, message) {
            document.getElementById(elementId).innerHTML = `<div class="result ${type}">${message}</div>`;
        }

        function createTestSession() {
            // Create realistic test user session
            const testUser = {
                id: 999,
                name: "Multi-Day Test User",
                email: "multiday@bank.ie",
                customerNumber: "99887766"
            };

            // Simulate complete frontend login process
            localStorage.setItem('bankingUser', JSON.stringify(testUser));
            localStorage.setItem('currentUser', testUser.customerNumber);
            localStorage.setItem('lastActiveUser', testUser.customerNumber);
            localStorage.setItem('app_was_active', 'true');
            
            // Create user-specific data
            localStorage.setItem(`user_${testUser.customerNumber}_bankAccounts`, JSON.stringify([
                { id: 1, displayName: "Current Account", accountNumber: "****2091", balance: "1500.00", accountType: "current" },
                { id: 2, displayName: "Savings Account", accountNumber: "****0978", balance: "5000.00", accountType: "savings" }
            ]));
            
            localStorage.setItem(`user_${testUser.customerNumber}_bankTransactions`, JSON.stringify([]));
            localStorage.setItem('userDataManager_cache', JSON.stringify({}));
            
            testStartTime = Date.now();
            
            showResult('step1-result', 'success', 
                `Test user created and logged in successfully<br>
                <div class="auth-status">
                User: ${testUser.name}<br>
                Customer ID: ${testUser.customerNumber}<br>
                Login Time: ${new Date().toLocaleString()}<br>
                localStorage entries: ${Object.keys(localStorage).length}
                </div>`
            );
        }

        function simulateTimePassage() {
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '<div class="day-marker">Multi-Day Simulation Timeline:</div>';
            
            const simulations = [
                { day: 'Day 1', hours: 24, test: 'Normal usage' },
                { day: 'Day 2', hours: 48, test: 'Browser restart simulation' },
                { day: 'Day 3', hours: 72, test: 'Cache operations' },
                { day: 'Week 1', hours: 168, test: 'Extended inactivity' },
                { day: 'Week 2', hours: 336, test: 'Profile operations' },
                { day: 'Month 1', hours: 720, test: 'Long-term persistence' }
            ];

            simulationResults = [];
            
            simulations.forEach((sim, index) => {
                setTimeout(() => {
                    const result = runDaySimulation(sim);
                    simulationResults.push(result);
                    
                    const dayDiv = document.createElement('div');
                    dayDiv.className = 'timeline';
                    dayDiv.innerHTML = `
                        <div class="day-marker">${sim.day} (${sim.hours}h elapsed)</div>
                        <div>Test: ${sim.test}</div>
                        <div class="result ${result.status}">${result.message}</div>
                    `;
                    timeline.appendChild(dayDiv);
                    
                    if (index === simulations.length - 1) {
                        showFinalResults();
                    }
                }, index * 500);
            });
        }

        function runDaySimulation(simulation) {
            // Check authentication state
            const bankingUser = localStorage.getItem('bankingUser');
            const currentUser = localStorage.getItem('currentUser');
            
            if (!bankingUser || !currentUser) {
                return {
                    status: 'error',
                    message: 'Authentication lost - permanent login failed!'
                };
            }

            // Simulate day-specific operations
            switch (simulation.day) {
                case 'Day 1':
                    return simulateNormalUsage();
                case 'Day 2':
                    return simulateBrowserRestart();
                case 'Day 3':
                    return simulateCacheOperations();
                case 'Week 1':
                    return simulateExtendedInactivity();
                case 'Week 2':
                    return simulateProfileOperations();
                case 'Month 1':
                    return simulateLongTermPersistence();
                default:
                    return { status: 'success', message: 'Authentication maintained' };
            }
        }

        function simulateNormalUsage() {
            // Simulate typical user operations
            const user = JSON.parse(localStorage.getItem('bankingUser'));
            const currentUser = localStorage.getItem('currentUser');
            
            // Simulate account balance updates
            localStorage.setItem(`user_${currentUser}_lastActivity`, Date.now().toString());
            
            if (user && currentUser) {
                return {
                    status: 'success',
                    message: `User ${user.name} remains logged in after normal usage`
                };
            }
            
            return { status: 'error', message: 'Authentication lost during normal usage' };
        }

        function simulateBrowserRestart() {
            // Test that authentication survives browser restart simulation
            const authDataBefore = {
                user: localStorage.getItem('bankingUser'),
                current: localStorage.getItem('currentUser'),
                lastActive: localStorage.getItem('lastActiveUser')
            };
            
            // Simulate browser restart (localStorage persists)
            const authDataAfter = {
                user: localStorage.getItem('bankingUser'),
                current: localStorage.getItem('currentUser'),
                lastActive: localStorage.getItem('lastActiveUser')
            };
            
            const persisted = authDataBefore.user === authDataAfter.user && 
                            authDataBefore.current === authDataAfter.current;
            
            if (persisted) {
                return {
                    status: 'success',
                    message: 'Authentication survived browser restart simulation'
                };
            }
            
            return { status: 'error', message: 'Authentication lost during browser restart' };
        }

        function simulateCacheOperations() {
            const userBefore = localStorage.getItem('bankingUser');
            
            // Simulate cache clearing operations (should be safe now)
            localStorage.removeItem('temp_cache_test');
            localStorage.setItem('temp_cache_test', 'test');
            localStorage.removeItem('temp_cache_test');
            
            const userAfter = localStorage.getItem('bankingUser');
            
            if (userBefore === userAfter) {
                return {
                    status: 'success',
                    message: 'Authentication preserved during cache operations'
                };
            }
            
            return { status: 'error', message: 'Authentication lost during cache operations' };
        }

        function simulateExtendedInactivity() {
            const user = JSON.parse(localStorage.getItem('bankingUser'));
            const timeSinceLogin = Date.now() - testStartTime;
            
            if (user && timeSinceLogin > 0) {
                return {
                    status: 'success',
                    message: `Authentication maintained after extended inactivity (${Math.floor(timeSinceLogin/1000)}s elapsed)`
                };
            }
            
            return { status: 'error', message: 'Authentication lost during extended inactivity' };
        }

        function simulateProfileOperations() {
            const userBefore = localStorage.getItem('bankingUser');
            
            // Simulate profile updates (should preserve auth)
            const currentUser = localStorage.getItem('currentUser');
            if (currentUser) {
                localStorage.setItem(`user_${currentUser}_profileLastUpdated`, Date.now().toString());
            }
            
            const userAfter = localStorage.getItem('bankingUser');
            
            if (userBefore === userAfter) {
                return {
                    status: 'success',
                    message: 'Authentication preserved during profile operations'
                };
            }
            
            return { status: 'error', message: 'Authentication lost during profile operations' };
        }

        function simulateLongTermPersistence() {
            const user = JSON.parse(localStorage.getItem('bankingUser'));
            const currentUser = localStorage.getItem('currentUser');
            const userDataKeys = Object.keys(localStorage).filter(k => k.startsWith('user_')).length;
            
            if (user && currentUser && userDataKeys > 0) {
                return {
                    status: 'success',
                    message: `Long-term persistence verified - User: ${user.name}, Data entries: ${userDataKeys}`
                };
            }
            
            return { status: 'error', message: 'Long-term persistence failed' };
        }

        function showFinalResults() {
            const passed = simulationResults.filter(r => r.status === 'success').length;
            const failed = simulationResults.filter(r => r.status === 'error').length;
            
            const finalMessage = `
                <div class="day-marker">Multi-Day Simulation Complete</div>
                <div class="auth-status">
                Results: ${passed} passed, ${failed} failed<br>
                ${failed === 0 ? 'SUCCESS: Permanent login maintained across all time periods' : 'FAILURE: Authentication lost during simulation'}
                </div>
            `;
            
            showResult('step2-result', failed === 0 ? 'success' : 'error', finalMessage);
        }

        function checkFrontendPersistence() {
            const user = localStorage.getItem('bankingUser');
            const currentUser = localStorage.getItem('currentUser');
            const lastActive = localStorage.getItem('lastActiveUser');
            const cache = localStorage.getItem('userDataManager_cache');
            
            let status = '<div class="day-marker">Current Authentication Status:</div>';
            
            if (user) {
                try {
                    const parsedUser = JSON.parse(user);
                    status += `<div class="auth-status">
                        Main User: ${parsedUser.name} (${parsedUser.email})<br>
                        Customer Number: ${parsedUser.customerNumber}<br>
                        Status: AUTHENTICATED
                    </div>`;
                } catch (e) {
                    status += '<div class="auth-status">Main User: Data corrupted but preserved</div>';
                }
            } else {
                status += '<div class="auth-status">Main User: NOT FOUND</div>';
            }
            
            if (currentUser) {
                status += `<div class="auth-status">Current User ID: ${currentUser}</div>`;
            }
            
            if (lastActive) {
                status += `<div class="auth-status">Last Active User: ${lastActive}</div>`;
            }
            
            const userDataCount = Object.keys(localStorage).filter(k => k.startsWith('user_')).length;
            const totalEntries = Object.keys(localStorage).length;
            
            status += `<div class="auth-status">
                User Data Entries: ${userDataCount}<br>
                Total localStorage Entries: ${totalEntries}<br>
                Time Since Test Start: ${Math.floor((Date.now() - testStartTime) / 1000)} seconds
            </div>`;
            
            const overallStatus = user && currentUser ? 'success' : 'error';
            const message = user && currentUser ? 
                'Frontend persistence working correctly - user remains authenticated' :
                'Frontend persistence failed - user authentication lost';
            
            showResult('step3-result', overallStatus, status + `<div class="result ${overallStatus}">${message}</div>`);
        }

        // Auto-check persistence on page load
        window.onload = function() {
            setTimeout(checkFrontendPersistence, 1000);
        };
    </script>
</body>
</html>
