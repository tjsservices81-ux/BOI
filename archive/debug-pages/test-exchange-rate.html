<!DOCTYPE html>
<html>
<head>
    <title>Add Exchange Rate to Test Transaction</title>
</head>
<body>
    <script>
        // Get existing transactions
        const transactions = JSON.parse(localStorage.getItem('bankTransactions') || '[]');
        
        // Find the first UK transfer and add exchange rate data
        const ukTransferIndex = transactions.findIndex(t => t.paymentMethod === 'UK Transfer');
        
        if (ukTransferIndex !== -1) {
            transactions[ukTransferIndex] = {
                ...transactions[ukTransferIndex],
                exchangeRate: 0.8456,
                convertedAmount: (parseFloat(transactions[ukTransferIndex].amount.replace('-', '')) * 0.8456).toFixed(2),
                convertedCurrency: 'GBP'
            };
            
            // Save back to localStorage
            localStorage.setItem('bankTransactions', JSON.stringify(transactions));
            
            console.log('Added exchange rate data to transaction:', transactions[ukTransferIndex]);
            document.body.innerHTML = '<h2>Exchange rate data added to first UK transfer transaction!</h2><p>Now go back to the app and click on a UK transfer to see the conversion rate display.</p>';
        } else {
            document.body.innerHTML = '<h2>No UK transfers found</h2>';
        }
    </script>
</body>
</html>
