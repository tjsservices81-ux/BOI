# Render deployment blueprint — free tier.
#
# New → Blueprint → this repo → branch claude/new-branch-from-main-hp295u.
# Render creates the database and the web service and wires DATABASE_URL between
# them; SESSION_SECRET is generated. No card required.
#
# The optional secrets below (sync: false) can all be left blank:
#
#   APP_ACCESS_CODE   the code that opens the app; defaults to BOI777777
#   ANTHROPIC_API_KEY enables the AI-backed live chat; without it chat falls
#                     back to the scripted replies
#   SENDGRID_API_KEY  with SENDGRID_FROM_EMAIL, enables email
#
# WHAT THE FREE TIER COSTS YOU
#
#   • No persistent disk — disks are a paid feature. The JSON files (invites,
#     team-page registrations, access codes) reset on every deploy. Customers
#     and accounts are unaffected: those live in Postgres. The access code
#     re-seeds itself on boot, so nobody gets locked out.
#   • The service sleeps after about 15 minutes idle, and the next visit waits
#     roughly a minute for it to wake.
#   • The free database expires after a limited period — Render shows the date
#     on its dashboard. When it goes, the data goes with it.
#
# To upgrade later: set plan to starter (service) and basic-256mb (database),
# add back the disk and preDeployCommand shown at the bottom of this file, and
# move db:push out of buildCommand.

databases:
  - name: boi-db
    databaseName: boi
    user: boi
    plan: free

services:
  - type: web
    name: boi-app
    runtime: node
    plan: free
    # Three things happen here, and the order matters.
    #
    # --include=dev: vite and esbuild are devDependencies, and npm omits those
    # when NODE_ENV=production — which is set below and applies to the build
    # too. Without the flag the build fails on "vite: not found".
    #
    # db:push creates the tables. It belongs in preDeployCommand, but that is a
    # paid feature, and the free tier has no Shell to run it from either — so
    # the build is the only place left. Safe to repeat: it applies differences
    # only, and reports no changes once the schema is current. --force keeps it
    # non-interactive, since a prompt here would hang until the build times out.
    buildCommand: npm ci --include=dev && npm run build && npm run db:push -- --force
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boi-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_ACCESS_CODE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false

# On a paid plan, add to the service above and drop db:push from buildCommand:
#
#     preDeployCommand: npm run db:push -- --force
#     disk:
#       name: boi-data
#       mountPath: /var/data
#       sizeGB: 1
#
# and add an env var DATA_DIR=/var/data so the JSON files live on the disk.
