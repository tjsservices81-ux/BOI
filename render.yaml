# Render deployment blueprint.
#
# New → Blueprint → pick this repo. Render then creates everything below in one
# go: the Postgres database, the web service, the persistent disk, and the wiring
# between them. DATABASE_URL and SESSION_SECRET are filled in automatically —
# nothing to copy and paste.
#
# The only prompt is for the optional secrets (sync: false), and those can be
# left blank:
#
#   APP_ACCESS_CODE   the code that opens the app; defaults to BOI777777
#   ANTHROPIC_API_KEY enables the AI-backed live chat; without it chat uses the
#                     scripted replies
#   SENDGRID_API_KEY  with SENDGRID_FROM_EMAIL, enables email
#   TWILIO_*          enables SMS
#
# Two things here are load-bearing and easy to lose in an edit:
#
#   • The disk. Render wipes the filesystem on every deploy, so without it the
#     invites, team-page registrations and access codes reset each redeploy —
#     which looks like the app randomly forgetting things.
#   • --include=dev on the build. vite and esbuild are devDependencies, and npm
#     omits those when NODE_ENV=production, which is set below and applies
#     during the build too. Without the flag the build fails on "vite: not
#     found".

databases:
  - name: boi-db
    databaseName: boi
    user: boi
    plan: basic-256mb

services:
  - type: web
    name: boi-app
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    # Creates the tables before the new version goes live. Safe to run on every
    # deploy: it only applies differences, so after the first time it is a no-op.
    # --force keeps it non-interactive; without it drizzle prompts and the
    # deploy hangs waiting for an answer nobody can give.
    preDeployCommand: npm run db:push -- --force
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: boi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boi-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: APP_ACCESS_CODE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
