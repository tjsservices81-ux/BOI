# Render deployment blueprint — paid, always-on, nothing resets.
#
# New → Blueprint → this repo → branch claude/new-branch-from-main-hp295u.
# Render creates the database and the web service, wires DATABASE_URL between
# them, and generates SESSION_SECRET.
#
# The optional secrets below (sync: false) can all be left blank:
#
#   APP_ACCESS_CODE   the code that opens the app; defaults to BOI777777
#   ANTHROPIC_API_KEY enables the AI-backed live chat; without it chat falls
#                     back to the scripted replies
#   SENDGRID_API_KEY  with SENDGRID_FROM_EMAIL, enables email
#
# WHAT THIS SETUP GIVES YOU (~$14/mo)
#
#   • Starter web service — never sleeps, no wake delay.
#   • A 1GB persistent disk at /var/data (DATA_DIR points there), so the JSON
#     files — invite links, team-page registrations, access codes, link counts
#     — survive every redeploy instead of resetting.
#   • A Basic database that does NOT expire, so customers and accounts are kept
#     for good.
#
# NOTE: switching an existing free deployment to these plans can make Render
# recreate the database. If you already have live customers, copy the data
# first. On a fresh/empty deployment there's nothing to lose.

databases:
  - name: boi-db
    databaseName: boi
    user: boi
    plan: basic-256mb

services:
  - type: web
    name: boi-app
    runtime: node
    plan: starter
    # --include=dev: vite and esbuild are devDependencies, and npm omits those
    # when NODE_ENV=production (set below, and it applies during the build too).
    # Without the flag the build fails on "vite: not found".
    buildCommand: npm ci --include=dev && npm run build
    # preDeployCommand runs after the build with the database reachable, before
    # the new version goes live — the right place to create/update tables. Safe
    # to repeat: it applies differences only and reports none once current.
    # --force keeps it non-interactive so a prompt can't hang the deploy.
    preDeployCommand: npm run db:push -- --force
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    # Persistent disk: the JSON runtime state lives here so redeploys don't wipe
    # invite links / team registrations / access codes / link counts.
    disk:
      name: boi-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boi-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: APP_ACCESS_CODE
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
