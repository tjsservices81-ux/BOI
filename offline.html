<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#126987">
  <title>Bank of Ireland - Offline</title>
  <link rel="apple-touch-icon" href="/boi_app_icon.png">
  <link rel="icon" href="/favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #126987 0%, #0e5a75 100%);
      color: white; 
      min-height: 100vh; 
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center; 
      justify-content: center; 
      padding: 20px;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .container { 
      text-align: center; 
      max-width: 400px; 
      width: 100%;
    }
    .logo-container {
      margin-bottom: 30px;
    }
    .logo { 
      font-size: 28px; 
      font-weight: 700; 
      letter-spacing: -0.5px;
      margin-bottom: 5px;
    }
    .logo-subtitle {
      font-size: 14px;
      opacity: 0.8;
    }
    .status-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 25px;
    }
    .status-icon svg {
      width: 40px;
      height: 40px;
      stroke: white;
      fill: none;
      stroke-width: 2;
    }
    .message { 
      margin-bottom: 30px; 
      line-height: 1.6; 
    }
    .message h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .message p {
      font-size: 15px;
      opacity: 0.9;
    }
    .status-text {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 25px;
      min-height: 20px;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn { 
      background: white; 
      color: #126987; 
      border: none;
      padding: 16px 30px; 
      border-radius: 12px; 
      font-size: 16px;
      font-weight: 600; 
      cursor: pointer; 
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: white;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    .loading { 
      display: inline-block; 
      width: 24px; 
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%; 
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
      vertical-align: middle;
    }
    .loading.hidden {
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .footer {
      position: fixed;
      bottom: 20px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <div class="logo">Bank of Ireland</div>
      <div class="logo-subtitle">Mobile Banking</div>
    </div>
    
    <div class="status-icon">
      <svg viewBox="0 0 24 24">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    
    <div class="message">
      <h2>You're Offline</h2>
      <p id="statusMessage">We can't reach our servers right now. Check your internet connection and try again.</p>
    </div>
    
    <div class="status-text" id="statusText"></div>
    
    <div class="buttons">
      <button class="btn" onclick="retryConnection()" id="retryBtn">
        <span class="loading hidden" id="loader"></span>
        <span id="retryText">Try Again</span>
      </button>
      <button class="btn btn-secondary" onclick="clearCacheAndReload()">Clear Cache & Reload</button>
    </div>
  </div>
  
  <div class="footer">
    Bank of Ireland Mobile v4.0.0
  </div>

  <script>
    let retryCount = 0;
    const maxRetries = 5;
    
    function updateStatus(message, showLoader = false) {
      document.getElementById('statusText').textContent = message;
      document.getElementById('loader').classList.toggle('hidden', !showLoader);
      document.getElementById('retryText').textContent = showLoader ? 'Connecting...' : 'Try Again';
      document.getElementById('retryBtn').disabled = showLoader;
    }
    
    async function retryConnection() {
      retryCount++;
      updateStatus(`Attempting to reconnect... (${retryCount}/${maxRetries})`, true);
      
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);
        
        const response = await fetch('/?_=' + Date.now(), { 
          method: 'HEAD',
          cache: 'no-cache',
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        if (response.ok) {
          updateStatus('Connection restored! Redirecting...', true);
          document.getElementById('statusMessage').textContent = 'Great news! We\'re back online.';
          setTimeout(() => {
            window.location.href = '/';
          }, 1000);
          return;
        }
      } catch (error) {
        console.log('Retry attempt failed:', error.name, error.message);
      }
      
      if (retryCount >= maxRetries) {
        updateStatus('Unable to connect. Please check your internet and try again later.', false);
        document.getElementById('statusMessage').textContent = 'We\'re having trouble connecting. Your internet may be down or our service may be temporarily unavailable.';
        retryCount = 0;
      } else {
        updateStatus(`Connection failed. Retrying in 3 seconds...`, false);
        setTimeout(retryConnection, 3000);
      }
    }
    
    async function clearCacheAndReload() {
      updateStatus('Clearing cache...', true);
      
      try {
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map(name => caches.delete(name)));
          console.log('All caches cleared');
        }
        
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(reg => reg.unregister()));
          console.log('Service workers unregistered');
        }
        
        localStorage.clear();
        sessionStorage.clear();
        
        updateStatus('Cache cleared! Reloading...', false);
        setTimeout(() => {
          window.location.href = '/?_=' + Date.now();
        }, 1000);
      } catch (error) {
        console.error('Cache clear error:', error);
        updateStatus('Could not clear cache. Please try reloading manually.', false);
      }
    }
    
    window.addEventListener('online', () => {
      updateStatus('Connection detected! Reconnecting...', true);
      setTimeout(() => {
        window.location.href = '/?_=' + Date.now();
      }, 1500);
    });
    
    window.addEventListener('offline', () => {
      updateStatus('You are offline.', false);
    });
    
    if (navigator.onLine) {
      setTimeout(retryConnection, 1500);
    } else {
      updateStatus('Waiting for internet connection...', false);
    }
  </script>
</body>
</html>
