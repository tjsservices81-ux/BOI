<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank of Ireland - Offline</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Open Sans', Arial, sans-serif;
            background: linear-gradient(135deg, #003366 0%, #0066cc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .offline-container {
            text-align: center;
            padding: 2rem;
            max-width: 400px;
        }
        
        .logo {
            width: 120px;
            height: 80px;
            background: white;
            border-radius: 8px;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #003366;
            font-size: 18px;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 1rem;
            font-weight: 300;
        }
        
        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            opacity: 0.9;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #ff6b6b;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .retry-button {
            background: white;
            color: #003366;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .retry-button:hover {
            background: #f0f0f0;
            transform: translateY(-1px);
        }
        
        .offline-features {
            margin-top: 2rem;
            text-align: left;
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 8px;
        }
        
        .offline-features h3 {
            font-size: 18px;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .offline-features ul {
            list-style: none;
        }
        
        .offline-features li {
            padding: 0.5rem 0;
            display: flex;
            align-items: center;
        }
        
        .offline-features li::before {
            content: "✓";
            margin-right: 0.5rem;
            color: #4CAF50;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="logo">BOI</div>
        
        <h1>You're Offline</h1>
        
        <p>
            <span class="status-indicator"></span>
            No internet connection detected. Some features may be limited.
        </p>
        
        <div class="offline-features">
            <h3>Available Offline</h3>
            <ul>
                <li>View cached account balances</li>
                <li>Browse recent transactions</li>
                <li>Access saved payees</li>
                <li>View profile information</li>
            </ul>
        </div>
        
        <button class="retry-button" onclick="window.location.reload()">
            Try Again
        </button>
    </div>
    
    <script>
        // Check for connection and redirect when back online
        function checkConnection() {
            if (navigator.onLine) {
                window.location.href = '/';
            }
        }
        
        // Check every 5 seconds
        setInterval(checkConnection, 5000);
        
        // Listen for online event
        window.addEventListener('online', () => {
            window.location.href = '/';
        });
    </script>
</body>
</html>
