<!DOCTYPE html>
<html>
<head>
    <title>Clear User Data</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f8f9fa; }
        .container { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto; }
        button { padding: 10px 20px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        .success { background: #28a745; }
        .info { background: #17a2b8; }
        .result { padding: 10px; margin: 10px 0; border-radius: 4px; background: #f8f9fa; border: 1px solid #dee2e6; }
        .code { font-family: monospace; background: #f1f3f4; padding: 5px; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Clear User Data for Testing</h1>
        
        <div class="result">
            <h3>Current localStorage Status:</h3>
            <div id="current-status"></div>
        </div>

        <button onclick="clearAllUserData()">Clear All User Data</button>
        <button onclick="clearSpecificUser()" class="info">Clear User 12345678</button>
        <button onclick="checkStatus()" class="success">Refresh Status</button>
        
        <div id="results"></div>
    </div>

    <script>
        function showResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'result';
            div.innerHTML = message;
            results.appendChild(div);
        }

        function checkStatus() {
            const status = document.getElementById('current-status');
            const allKeys = Object.keys(localStorage);
            const userKeys = allKeys.filter(k => k.includes('user_') || k === 'bankingUser' || k === 'currentUser' || k === 'lastActiveUser');
            
            let html = `<div class="code">Total localStorage entries: ${allKeys.length}</div>`;
            html += `<div class="code">User-related entries: ${userKeys.length}</div>`;
            
            if (userKeys.length > 0) {
                html += '<div style="margin-top: 10px;"><strong>User-related keys:</strong></div>';
                userKeys.forEach(key => {
                    const value = localStorage.getItem(key);
                    html += `<div class="code">${key}: ${value ? value.substring(0, 50) + '...' : 'null'}</div>`;
                });
            } else {
                html += '<div style="color: green; margin-top: 10px;"><strong>No user data found - clean state</strong></div>';
            }
            
            status.innerHTML = html;
        }

        function clearAllUserData() {
            const keysToRemove = [];
            
            // Find all user-related keys
            Object.keys(localStorage).forEach(key => {
                if (key.includes('user_') || 
                    key === 'bankingUser' || 
                    key === 'currentUser' || 
                    key === 'lastActiveUser' ||
                    key === 'bankUsers' ||
                    key.includes('bankingUser_') ||
                    key.includes('parseFailures') ||
                    key.includes('userDataManager_') ||
                    key === 'bankAccounts' ||
                    key === 'bankTransactions' ||
                    key === 'savedPayees' ||
                    key === 'recentPayees') {
                    keysToRemove.push(key);
                }
            });
            
            // Remove all user data
            keysToRemove.forEach(key => localStorage.removeItem(key));
            
            showResult(`Cleared ${keysToRemove.length} user data entries: ${keysToRemove.join(', ')}`, 'success');
            checkStatus();
        }

        function clearSpecificUser() {
            const customerNumber = '12345678';
            const keysToRemove = [];
            
            // Find keys specific to this user
            Object.keys(localStorage).forEach(key => {
                if (key.includes(customerNumber) || 
                    key.startsWith(`user_${customerNumber}_`) ||
                    (key === 'currentUser' && localStorage.getItem(key) === customerNumber) ||
                    (key === 'lastActiveUser' && localStorage.getItem(key) === customerNumber)) {
                    keysToRemove.push(key);
                }
            });
            
            // Also check if bankingUser contains this customer
            const bankingUser = localStorage.getItem('bankingUser');
            if (bankingUser) {
                try {
                    const user = JSON.parse(bankingUser);
                    if (user.id && user.id.toString().includes('12345678')) {
                        keysToRemove.push('bankingUser');
                    }
                } catch (e) {
                    // If corrupted, remove it anyway
                    keysToRemove.push('bankingUser');
                }
            }
            
            // Remove user-specific data
            keysToRemove.forEach(key => localStorage.removeItem(key));
            
            showResult(`Cleared ${keysToRemove.length} entries for user ${customerNumber}: ${keysToRemove.join(', ')}`, 'success');
            checkStatus();
        }

        // Auto-check status on load
        window.onload = checkStatus;
    </script>
</body>
</html>
