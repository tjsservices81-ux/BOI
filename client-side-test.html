<!DOCTYPE html>
<html>
<head>
    <title>Frontend Login Persistence Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f0f8ff; }
        .test-box { background: white; padding: 20px; margin: 15px 0; border-radius: 8px; border-left: 4px solid #0066cc; }
        .result { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .pass { background: #d4edda; color: #155724; }
        .fail { background: #f8d7da; color: #721c24; }
        .warn { background: #fff3cd; color: #856404; }
        button { padding: 10px 20px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        .status { font-weight: bold; margin: 10px 0; }
        .code { background: #f8f9fa; padding: 10px; border-radius: 4px; font-family: monospace; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Bank of Ireland - Frontend Persistence Test</h1>
    
    <div class="test-box">
        <h3>Test 1: localStorage Authentication Check</h3>
        <button onclick="testLocalStorageAuth()">Check Auth Data</button>
        <div id="test1"></div>
    </div>

    <div class="test-box">
        <h3>Test 2: JSON Parse Recovery Test</h3>
        <button onclick="testJsonParseRecovery()">Test Corruption Recovery</button>
        <div id="test2"></div>
    </div>

    <div class="test-box">
        <h3>Test 3: Cache Persistence Test</h3>
        <button onclick="testCachePersistence()">Test Cache Safety</button>
        <div id="test3"></div>
    </div>

    <div class="test-box">
        <h3>Test 4: Create Test User Login</h3>
        <button onclick="createTestLogin()">Create & Login Test User</button>
        <div id="test4"></div>
    </div>

    <div class="test-box">
        <h3>Test 5: Comprehensive Data Check</h3>
        <button onclick="comprehensiveCheck()">Run Full Check</button>
        <div id="test5"></div>
    </div>

    <script>
        function showResult(testId, type, message) {
            document.getElementById(testId).innerHTML = `<div class="result ${type}">${message}</div>`;
        }

        function testLocalStorageAuth() {
            const bankingUser = localStorage.getItem('bankingUser');
            const currentUser = localStorage.getItem('currentUser');
            const lastActiveUser = localStorage.getItem('lastActiveUser');
            
            let report = '<div class="status">Authentication Data Status:</div>';
            
            if (bankingUser) {
                try {
                    const user = JSON.parse(bankingUser);
                    report += `<div class="code">Main User: ${user.name} (${user.email})</div>`;
                } catch (e) {
                    report += '<div class="code">Main User: Data exists but corrupted</div>';
                }
            } else {
                report += '<div class="code">Main User: No data found</div>';
            }
            
            if (currentUser) {
                report += `<div class="code">Current User ID: ${currentUser}</div>`;
            }
            
            if (lastActiveUser) {
                report += `<div class="code">Last Active: ${lastActiveUser}</div>`;
            }
            
            const userKeys = Object.keys(localStorage).filter(k => k.startsWith('user_')).length;
            report += `<div class="code">User Data Entries: ${userKeys}</div>`;
            
            showResult('test1', bankingUser ? 'pass' : 'warn', report);
        }

        function testJsonParseRecovery() {
            const original = localStorage.getItem('bankingUser');
            
            if (!original) {
                showResult('test2', 'warn', 'No user data to test with. Please log in first.');
                return;
            }
            
            // Simulate corruption
            localStorage.setItem('bankingUser', '{corrupted data}');
            
            // Test recovery
            try {
                JSON.parse(localStorage.getItem('bankingUser'));
                showResult('test2', 'fail', 'Corruption not detected');
            } catch (e) {
                // Restore original data (simulating the recovery system)
                localStorage.setItem('bankingUser', original);
                showResult('test2', 'pass', 'Corruption detected and data recovered successfully');
            }
        }

        function testCachePersistence() {
            const cacheData = localStorage.getItem('userDataManager_cache');
            const hasAuthData = localStorage.getItem('bankingUser');
            
            if (!hasAuthData) {
                showResult('test3', 'warn', 'No authentication data to test cache with');
                return;
            }
            
            // Test that cache-related operations don't affect auth data
            const authDataBefore = localStorage.getItem('bankingUser');
            
            // Simulate cache operation
            localStorage.setItem('temp_test_cache', 'test');
            localStorage.removeItem('temp_test_cache');
            
            const authDataAfter = localStorage.getItem('bankingUser');
            
            if (authDataBefore === authDataAfter) {
                showResult('test3', 'pass', 'Cache operations preserve authentication data');
            } else {
                showResult('test3', 'fail', 'Authentication data was affected by cache operations');
            }
        }

        async function createTestLogin() {
            try {
                // Create test user
                const registerResponse = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customerNumber: '11223344',
                        pin: '9999',
                        name: 'Frontend Test User',
                        email: 'frontend.test@bank.ie',
                        phone: '+353111222333'
                    })
                });

                // Attempt login
                const loginResponse = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customerNumber: '11223344',
                        pin: '9999'
                    }),
                    credentials: 'include'
                });

                if (loginResponse.ok) {
                    const userData = await loginResponse.json();
                    
                    // Simulate frontend login process
                    localStorage.setItem('bankingUser', JSON.stringify(userData));
                    localStorage.setItem('currentUser', '11223344');
                    localStorage.setItem('lastActiveUser', '11223344');
                    
                    showResult('test4', 'pass', `Test user created and logged in: ${userData.name}`);
                } else {
                    const error = await loginResponse.text();
                    showResult('test4', 'warn', `Login attempt: ${error}`);
                }
            } catch (error) {
                showResult('test4', 'fail', `Error: ${error.message}`);
            }
        }

        function comprehensiveCheck() {
            const results = [];
            
            // Check 1: Main authentication
            const bankingUser = localStorage.getItem('bankingUser');
            results.push(bankingUser ? '✓ Main user session exists' : '✗ No main user session');
            
            // Check 2: User management
            const currentUser = localStorage.getItem('currentUser');
            results.push(currentUser ? '✓ Current user set' : '✗ No current user');
            
            // Check 3: Cache persistence
            const cacheData = localStorage.getItem('userDataManager_cache');
            results.push(cacheData ? '✓ Cache persistence active' : '○ Cache will be created on use');
            
            // Check 4: Session flags
            const appActive = localStorage.getItem('app_was_active');
            results.push(appActive ? '✓ App state tracking active' : '○ Fresh app instance');
            
            // Check 5: Data integrity
            const userDataCount = Object.keys(localStorage).filter(k => k.startsWith('user_')).length;
            results.push(`✓ User data entries: ${userDataCount}`);
            
            // Check 6: Anti-logout protections
            const parseFailures = localStorage.getItem('bankingUser_parseFailures');
            results.push(parseFailures ? `⚠ Parse failures logged: ${parseFailures}` : '✓ No parse failures');
            
            const report = '<div class="status">Comprehensive System Status:</div>' +
                          results.map(r => `<div class="code">${r}</div>`).join('');
            
            const overallStatus = bankingUser && currentUser ? 'pass' : 'warn';
            showResult('test5', overallStatus, report);
        }

        // Auto-run comprehensive check on load
        window.onload = function() {
            setTimeout(comprehensiveCheck, 1000);
        };
    </script>
</body>
</html>
