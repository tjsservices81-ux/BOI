<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Functionality Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .online { background: #d4edda; border: 1px solid #c3e6cb; }
        .offline { background: #f8d7da; border: 1px solid #f5c6cb; }
        .test-result { margin: 10px 0; padding: 10px; background: #f8f9fa; border: 1px solid #dee2e6; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Bank of Ireland - Offline Functionality Test</h1>
    
    <div id="connectionStatus" class="status">
        <strong>Connection Status:</strong> <span id="statusText">Checking...</span>
    </div>

    <div class="test-result">
        <h3>Service Worker Status</h3>
        <div id="swStatus">Checking service worker...</div>
    </div>

    <div class="test-result">
        <h3>IndexedDB Test</h3>
        <button onclick="testIndexedDB()">Test IndexedDB Storage</button>
        <div id="idbResult"></div>
    </div>

    <div class="test-result">
        <h3>API Cache Test</h3>
        <button onclick="testAPICache()">Test API Caching</button>
        <div id="apiResult"></div>
    </div>

    <div class="test-result">
        <h3>Offline Login Test</h3>
        <button onclick="testOfflineLogin()">Test Offline Authentication</button>
        <div id="offlineResult"></div>
    </div>

    <script>
        // Check connection status
        function updateConnectionStatus() {
            const status = navigator.onLine ? 'online' : 'offline';
            const statusEl = document.getElementById('connectionStatus');
            const textEl = document.getElementById('statusText');
            
            statusEl.className = `status ${status}`;
            textEl.textContent = status.toUpperCase();
        }

        // Check service worker
        async function checkServiceWorker() {
            const swEl = document.getElementById('swStatus');
            
            if ('serviceWorker' in navigator) {
                try {
                    const registration = await navigator.serviceWorker.getRegistration();
                    if (registration) {
                        swEl.innerHTML = `✅ Service Worker: Active (${registration.scope})`;
                    } else {
                        swEl.innerHTML = `⚠️ Service Worker: Not registered`;
                    }
                } catch (error) {
                    swEl.innerHTML = `❌ Service Worker: Error - ${error.message}`;
                }
            } else {
                swEl.innerHTML = `❌ Service Worker: Not supported`;
            }
        }

        // Test IndexedDB
        async function testIndexedDB() {
            const resultEl = document.getElementById('idbResult');
            resultEl.innerHTML = 'Testing IndexedDB...';

            try {
                // Import the OfflineManager (simulated)
                const testData = {
                    customerNumber: 'TEST123',
                    userData: { name: 'Test User', email: 'test@example.com' },
                    lastOnlineLogin: Date.now(),
                    sessionData: {},
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                };

                // Test IndexedDB availability
                if ('indexedDB' in window) {
                    const request = indexedDB.open('BankOfIrelandDB', 1);
                    
                    request.onerror = () => {
                        resultEl.innerHTML = '❌ IndexedDB: Failed to open database';
                    };
                    
                    request.onsuccess = (event) => {
                        const db = event.target.result;
                        resultEl.innerHTML = `✅ IndexedDB: Available (Version ${db.version})`;
                        db.close();
                    };
                    
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('users')) {
                            db.createObjectStore('users', { keyPath: 'customerNumber' });
                        }
                    };
                } else {
                    resultEl.innerHTML = '❌ IndexedDB: Not supported';
                }
            } catch (error) {
                resultEl.innerHTML = `❌ IndexedDB: Error - ${error.message}`;
            }
        }

        // Test API caching
        async function testAPICache() {
            const resultEl = document.getElementById('apiResult');
            resultEl.innerHTML = 'Testing API caching...';

            try {
                const response = await fetch('/api/health');
                const data = await response.json();
                const servedBy = response.headers.get('X-Served-By');
                
                if (servedBy === 'service-worker-cache') {
                    resultEl.innerHTML = `✅ API Cache: Served from cache - ${JSON.stringify(data)}`;
                } else {
                    resultEl.innerHTML = `✅ API Cache: Served from network - ${JSON.stringify(data)}`;
                }
            } catch (error) {
                resultEl.innerHTML = `❌ API Cache: Error - ${error.message}`;
            }
        }

        // Test offline login capability
        async function testOfflineLogin() {
            const resultEl = document.getElementById('offlineResult');
            resultEl.innerHTML = 'Testing offline login...';

            try {
                // Check if we have stored user data
                const userData = localStorage.getItem('currentUser');
                if (userData) {
                    resultEl.innerHTML = `✅ Offline Login: User data found (${userData})`;
                } else {
                    resultEl.innerHTML = `⚠️ Offline Login: No user data stored (login online first)`;
                }
            } catch (error) {
                resultEl.innerHTML = `❌ Offline Login: Error - ${error.message}`;
            }
        }

        // Initialize tests
        updateConnectionStatus();
        checkServiceWorker();

        // Listen for connection changes
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);

        // Auto-refresh status every 5 seconds
        setInterval(updateConnectionStatus, 5000);
    </script>
</body>
</html>
