<!DOCTYPE html>
<html>
<head>
    <title>Clean Up Transaction Data</title>
</head>
<body>
    <script>
        // Get existing transactions
        const transactions = JSON.parse(localStorage.getItem('bankTransactions') || '[]');
        
        console.log('Original transactions:', transactions.length);
        
        // Remove paymentMethod from transactions that aren't actually transfers
        const cleanedTransactions = transactions.map(transaction => {
            // If it's a regular expense/income transaction (not a real transfer), remove paymentMethod
            if (transaction.paymentMethod === 'Bank Transfer' && 
                !transaction.recipientAccountNumber && 
                !transaction.recipientSortCode && 
                !transaction.iban) {
                const { paymentMethod, ...cleanTransaction } = transaction;
                console.log('Cleaned transaction:', transaction.description);
                return cleanTransaction;
            }
            return transaction;
        });
        
        // Save cleaned transactions back to localStorage
        localStorage.setItem('bankTransactions', JSON.stringify(cleanedTransactions));
        
        const cleanedCount = cleanedTransactions.filter(t => !t.paymentMethod).length;
        const transferCount = cleanedTransactions.filter(t => t.paymentMethod).length;
        
        document.body.innerHTML = `
            <h2>Transaction Data Cleanup Complete!</h2>
            <p>Total transactions: ${cleanedTransactions.length}</p>
            <p>Regular transactions (no transfer type): ${cleanedCount}</p>
            <p>Actual transfers: ${transferCount}</p>
            <p>Now go back to the app and check transaction details - regular purchases should no longer show "Bank Transfer".</p>
        `;
    </script>
</body>
</html>
